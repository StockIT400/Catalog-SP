<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Catalog Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <h1 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> เพิ่มรายการสินค้าใหม่ (รองรับหลายหน้า A4)
      </h1>
      <!-- ฟอร์มเพิ่มสินค้า (คงเดิมตามระบบของคุณ) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อรายการสินค้า</label>
          <input type="text" id="product-title" placeholder="เช่น แบบเสื้อลายใหม่ 2026" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">รูปปกหน้าค้า (สำหรับแสดงหน้ารวม)</label>
          <input type="file" id="cover-file" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">รูปภาพหน้า A4 ด้านใน (เลือกได้หลายรูป)</label>
          <input type="file" id="multi-files" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
      </div>
      <div class="mt-4 flex justify-end">
        <button onclick="uploadProduct()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2">
          <i data-lucide="upload" class="w-4 h-4"></i> บีบอัดและอัปโหลดเข้าหมวดนี้
        </button>
      </div>
    </div>

    <!-- ส่วนแสดงรายการสินค้าในระบบแอดมิน -->
    <div id="admin-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- รายการสินค้าจะถูกเรนเดอร์ตรงนี้ผ่าน JavaScript -->
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yzfjddyrewgajrvymhin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmpkZHlyZXdnYWpydnltaGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTUxNjcsImV4cCI6MjEwMzQ3MTE2N30.C0n2fy1qw0E2qdHzLeid1QnkUuotxyHPD7Nb6gyZzmk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    lucide.createIcons();

    // ตัวอย่างฟังก์ชันเรนเดอร์รายการสินค้าฝั่งแอดมิน ที่ปรับให้กล่องรูปยืดหยุ่นตามสัดส่วนจริง
    function renderAdminProducts(products) {
      const grid = document.getElementById('admin-product-grid');
      if (!products || products.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ยังไม่มีสินค้าในระบบ</p>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const coverImg = p.image_url || 'https://via.placeholder.com/400x500?text=No+Image';
        const imgCount = p.images ? p.images.length : 1;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between">
            <div>
              <!-- ปรับให้กรอบรูปปรับความสูงตามรูปภาพจริงอัตโนมัติ -->
              <div class="w-full bg-slate-50 mb-3 rounded-xl border border-slate-100 relative overflow-hidden flex items-center justify-center p-3">
                <img src="${coverImg}" class="w-full h-auto max-h-96 object-contain">
                <span class="absolute top-2 left-2 px-2 py-0.5 bg-indigo-600 text-white text-[10px] font-bold rounded-md shadow">${imgCount} รูป</span>
              </div>
              <h4 class="font-extrabold text-xs sm:text-sm text-slate-800 truncate mb-2">${p.title}</h4>
            </div>

            <div class="flex items-center justify-between border-t border-slate-100 pt-3">
              <button class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-500 rounded-lg transition"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
              <button class="p-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
              <button class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }
  </script>
</body>
</html>
