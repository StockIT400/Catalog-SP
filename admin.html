<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Catalog Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .bg-dots-pattern {
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .draggable-card.dragging { opacity: 0.4; border: 2px dashed #6366f1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative antialiased bg-dots-pattern pb-20">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-md">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-bold text-base text-slate-900 block leading-tight tracking-tight">Admin Dashboard</span>
          <span class="text-[11px] text-slate-500 font-medium">จัดการหมวดหมู่และสินค้า A4</span>
        </div>
      </div>
      <button id="btn-back-main" onclick="showCategoryView()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2 border border-slate-200">
        <i data-lucide="arrow-left" class="w-4 h-4 text-slate-500"></i>
        <span>กลับไปหน้าหมวดหมู่</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- SECTION: CATEGORIES -->
    <div id="section-categories" class="space-y-8">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="folder-plus" class="w-5 h-5 text-indigo-600"></i> เพิ่มหมวดหมู่สินค้าใหม่
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input type="text" id="cat-name" placeholder="ชื่อหมวดหมู่สินค้า..." class="px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <input type="file" id="cat-cover" accept="image/*" class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <button onclick="addCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition shadow-sm">บันทึกหมวดหมู่</button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="w-2 h-6 bg-indigo-600 rounded-full"></div>
          <h2 class="text-base font-bold text-slate-900">รายการหมวดหมู่ทั้งหมด</h2>
        </div>
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-cat-input" onkeyup="filterCategories()" placeholder="ค้นหาหมวดหมู่..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <p class="text-slate-400 text-sm col-span-full text-center py-12">กำลังโหลดหมวดหมู่...</p>
      </div>
    </div>

    <!-- SECTION: PRODUCTS -->
    <div id="section-products" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i> เพิ่มรายการสินค้าในหมวด: <span id="current-cat-title" class="text-indigo-600"></span>
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input type="text" id="p-title" placeholder="ชื่อรายการสินค้า..." class="px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">ภาพปก (Cover)</label>
            <input type="file" id="p-cover" accept="image/*" class="w-full px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 file:mr-2 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-indigo-50 file:text-indigo-700">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">ไฟล์รูป A4 (เลือกได้หลายรูป)</label>
            <input type="file" id="p-images" multiple accept="image/*" class="w-full px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 file:mr-2 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-indigo-50 file:text-indigo-700">
          </div>
        </div>
        <button onclick="addProduct()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-6 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
          <i data-lucide="upload-cloud" class="w-4 h-4"></i> <span id="upload-btn-text">บีบอัดและอัปโหลดเข้าหมวดนี้</span>
        </button>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <h3 class="font-bold text-slate-900 text-sm">รายการสินค้าในหมวดหมู่</h3>
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="ค้นหาสินค้า..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div id="product-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <p class="text-slate-400 text-sm col-span-full text-center py-12">ยังไม่มีรายการในหมวดนี้</p>
      </div>
    </div>

  </main>

  <!-- MODAL: EDIT PRODUCT -->
  <div id="edit-prod-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-base text-slate-900">แก้ไขรายการสินค้า</h3>
        <button onclick="closeEditProdModal()" class="p-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <input type="hidden" id="edit-prod-id">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">ชื่อสินค้า</label>
          <input type="text" id="edit-prod-title" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">เปลี่ยนภาพปก (Cover ใหม่ถ้าต้องการ)</label>
          <input type="file" id="edit-prod-cover" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">เพิ่มรูปภาพ A4 ใหม่ด้านใน</label>
          <input type="file" id="edit-prod-new-images" multiple accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">จัดเรียงและจัดการหน้า A4 (ลากเพื่อสลับตำแหน่ง)</label>
          <div id="edit-prod-images-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto p-2 bg-slate-50 rounded-2xl border"></div>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t">
        <button onclick="closeEditProdModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl">ยกเลิก</button>
        <button onclick="saveEditProduct()" id="btn-save-prod" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow">บันทึกการแก้ไข</button>
      </div>
    </div>
  </div>

  <!-- MODAL: VIEW A4 -->
  <div id="a4-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-4xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-sm">ตัวอย่างภาพ A4</h3>
        <button onclick="closeA4Modal()" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex-grow bg-slate-100 flex items-center justify-center relative p-4 overflow-hidden">
        <img id="modal-img-a4" src="" class="max-w-full max-h-full object-contain shadow-md rounded-lg bg-white">
      </div>
      <div id="modal-nav" class="p-3 bg-slate-900 text-white flex items-center justify-between text-xs">
        <button onclick="prevModalImg()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> ก่อนหน้า</button>
        <span id="modal-counter" class="font-bold text-slate-300">1 / 1</span>
        <button onclick="nextModalImg()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center gap-1">ถัดไป <i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yzfjddyrewgajrvymhin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmpkZHlyZXdnYWpydnltaGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTUxNjcsImV4cCI6MjEwMzQ3MTE2N30.C0n2fy1qw0E2qdHzLeid1QnkUuotxyHPD7Nb6gyZzmk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categoriesData = [];
    let currentCategoryId = null;
    let currentCategoryProducts = [];
    let editingProductData = null;
    let activeModalImages = [];
    let modalImageIndex = 0;

    lucide.createIcons();

    async function init() {
      await loadCategories();
    }

    async function loadCategories() {
      const { data } = await supabaseClient.from('categories').select('*').order('id', { ascending: true });
      categoriesData = data || [];
      renderCategories(categoriesData);
    }

    function filterCategories() {
      const query = document.getElementById('search-cat-input').value.toLowerCase();
      const filtered = categoriesData.filter(c => c.name.toLowerCase().includes(query));
      renderCategories(filtered);
    }

    function renderCategories(items) {
      const grid = document.getElementById('category-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ไม่พบหมวดหมู่สินค้า</p>`;
        return;
      }

      grid.innerHTML = items.map(c => `
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between group">
          <div class="cursor-pointer" onclick="openCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')">
            <div class="aspect-[4/3] rounded-xl overflow-hidden bg-slate-100 mb-3 border border-slate-100 relative flex items-center justify-center p-2">
              ${c.cover_url ? `<img src="${c.cover_url}" class="w-full h-full object-contain">` : `<i data-lucide="folder" class="w-10 h-10 text-slate-300"></i>`}
            </div>
            <h3 class="font-bold text-slate-800 text-sm group-hover:text-indigo-600 transition truncate">${c.name}</h3>
          </div>
          <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 mt-3">
            <button onclick="deleteCategory(${c.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบ
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function addCategory() {
      const name = document.getElementById('cat-name').value;
      const file = document.getElementById('cat-cover').files[0];
      if (!name) return alert("กรุณากรอกชื่อหมวดหมู่");

      try {
        let coverUrl = '';
        if (file) {
          const compressed = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 800, useWebWorker: true });
          const fileName = `cat_cover_${Date.now()}.webp`;
          const { error: uploadErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressed);
          if (uploadErr) throw uploadErr;
          coverUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
        }

        const { error } = await supabaseClient.from('categories').insert([{ name, cover_url: coverUrl }]);
        if (error) throw error;

        document.getElementById('cat-name').value = '';
        document.getElementById('cat-cover').value = '';
        loadCategories();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    async function deleteCategory(id) {
      if (confirm("ยืนยันการลบหมวดหมู่นี้?")) {
        await supabaseClient.from('categories').delete().eq('id', id);
        loadCategories();
      }
    }

    function openCategory(catId, catName) {
      currentCategoryId = catId;
      document.getElementById('current-cat-title').innerText = catName;
      document.getElementById('section-categories').classList.add('hidden');
      document.getElementById('section-products').classList.remove('hidden');
      document.getElementById('btn-back-main').classList.remove('hidden');
      loadCategoryProducts(catId);
    }

    function showCategoryView() {
      currentCategoryId = null;
      document.getElementById('section-categories').classList.remove('hidden');
      document.getElementById('section-products').classList.add('hidden');
      document.getElementById('btn-back-main').classList.add('hidden');
    }

    async function loadCategoryProducts(catId) {
      const { data: products } = await supabaseClient.from('products').select('*').eq('category_id', catId).order('id', { ascending: false });
      const { data: images } = await supabaseClient.from('product_images').select('*').order('sort_order', { ascending: true });

      currentCategoryProducts = (products || []).map(p => {
        let prodImgs = (images || []).filter(img => img.product_id === p.id);
        if (prodImgs.length === 0 && p.image_url) {
          prodImgs.push({ id: 'legacy', image_url: p.image_url, sort_order: 0 });
        }
        const coverImg = p.cover_url || prodImgs[0]?.image_url || 'https://via.placeholder.com/400x500?text=No+Image';
        return { ...p, images: prodImgs, coverImg };
      });

      renderProducts(currentCategoryProducts);
    }

    function renderProducts(items) {
      const list = document.getElementById('product-list');
      if (items.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ยังไม่มีรายการในหมวดนี้</p>`;
        return;
      }

      list.innerHTML = items.map(p => {
        const imgCount = p.images.length;
        const imagesJson = JSON.stringify(p.images.map(i => i.image_url)).replace(/"/g, '&quot;');

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm relative group flex flex-col justify-between">
            <div>
              <div onclick="openA4Modal('${p.title.replace(/'/g, "\\'")}', ${imagesJson})" class="aspect-[1/1.414] rounded-xl overflow-hidden bg-slate-100 mb-2 border border-slate-200 relative cursor-pointer group-hover:opacity-95 transition flex items-center justify-center p-2">
                <img src="${p.coverImg}" class="w-full h-full object-contain">
                <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-medium gap-1 rounded-xl">
                  <i data-lucide="maximize-2" class="w-4 h-4"></i> ดู A4 (${imgCount} หน้า)
                </div>
                ${imgCount > 0 ? `<span class="absolute top-2 left-2 bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">${imgCount} รูป</span>` : ''}
              </div>
              <h4 class="font-bold text-xs text-slate-800 truncate mb-2">${p.title}</h4>
            </div>
            
            <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-100">
              <button onclick="toggleActive(${p.id}, ${p.is_active})" title="${p.is_active ? 'ซ่อน' : 'แสดง'}" class="col-span-1 ${p.is_active ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'} text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="${p.is_active ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="openEditProdModal(${p.id})" title="แก้ไข" class="col-span-1 bg-blue-50 text-blue-600 hover:bg-blue-100 text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteProduct(${p.id})" title="ลบ" class="col-span-1 bg-red-50 text-red-600 hover:bg-red-100 text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function addProduct() {
      const title = document.getElementById('p-title').value;
      const coverFile = document.getElementById('p-cover').files[0];
      const fileInput = document.getElementById('p-images');
      const files = fileInput.files;

      if (!title || files.length === 0) return alert("กรุณากรอกชื่อรายการและเลือกไฟล์ภาพ A4 อย่างน้อย 1 รูป");

      const btnText = document.getElementById('upload-btn-text');
      btnText.innerText = "กำลังอัปโหลดรูปภาพ...";

      try {
        let coverUrl = '';
        if (coverFile) {
          const compressedCover = await imageCompression(coverFile, { maxSizeMB: 0.5, maxWidthOrHeight: 1000, useWebWorker: true });
          const coverFileName = `prod_cover_${Date.now()}.webp`;
          const { error: coverErr } = await supabaseClient.storage.from('product-images').upload(coverFileName, compressedCover);
          if (coverErr) throw coverErr;
          coverUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${coverFileName}`;
        }

        const { data: prodData, error: prodErr } = await supabaseClient.from('products').insert([{ 
          title, 
          category_id: currentCategoryId, 
          image_url: coverUrl || '', 
          cover_url: coverUrl,
          is_active: true 
        }]).select();

        if (prodErr) throw prodErr;
        const newProductId = prodData[0].id;

        for (let i = 0; i < files.length; i++) {
          const compressed = await imageCompression(files[i], { maxSizeMB: 0.7, maxWidthOrHeight: 2000, useWebWorker: true });
          const fileName = `a4_${newProductId}_${Date.now()}_${i}.webp`;
          const { error: uploadErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressed);
          if (uploadErr) throw uploadErr;

          const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
          await supabaseClient.from('product_images').insert([{ product_id: newProductId, image_url: imageUrl, sort_order: i }]);
        }

        document.getElementById('p-title').value = '';
        document.getElementById('p-cover').value = '';
        fileInput.value = '';
        btnText.innerText = "บีบอัดและอัปโหลดเข้าหมวดนี้";
        loadCategoryProducts(currentCategoryId);
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btnText.innerText = "บีบอัดและอัปโหลดเข้าหมวดนี้";
      }
    }

    function openEditProdModal(productId) {
      const prod = currentCategoryProducts.find(p => p.id === productId);
      if (!prod) return;
      editingProductData = JSON.parse(JSON.stringify(prod));

      document.getElementById('edit-prod-id').value = prod.id;
      document.getElementById('edit-prod-title').value = prod.title;
      document.getElementById('edit-prod-cover').value = '';
      document.getElementById('edit-prod-new-images').value = '';

      renderEditProductImages();
      document.getElementById('edit-prod-modal').classList.remove('hidden');
    }

    function renderEditProductImages() {
      const container = document.getElementById('edit-prod-images-container');
      if (!editingProductData || editingProductData.images.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 col-span-full text-center py-4">ยังไม่มีรูปภาพ A4 ด้านใน</p>`;
        return;
      }

      container.innerHTML = editingProductData.images.map((img, idx) => `
        <div draggable="true" ondragstart="handleDragStart(event, ${idx})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${idx})" class="draggable-card bg-white p-2 rounded-xl border border-slate-200 flex items-center gap-3 shadow-sm">
          <div class="text-slate-400 font-bold text-xs cursor-grab px-1">☰</div>
          <div class="w-12 h-16 bg-slate-100 rounded-lg overflow-hidden flex-shrink-0 border border-slate-200 flex items-center justify-center">
            <img src="${img.image_url}" class="w-full h-full object-contain pointer-events-none">
          </div>
          <div class="flex-grow flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700">หน้า A4 ที่ ${idx + 1}</span>
            <button onclick="deleteSingleProductImage(${idx})" type="button" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    let draggedIndex = null;
    function handleDragStart(e, index) { draggedIndex = index; e.target.classList.add('dragging'); }
    function handleDragOver(e) { e.preventDefault(); }
    function handleDrop(e, targetIndex) {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === targetIndex) return;
      const movedItem = editingProductData.images.splice(draggedIndex, 1)[0];
      editingProductData.images.splice(targetIndex, 0, movedItem);
      draggedIndex = null;
      renderEditProductImages();
    }

    async function deleteSingleProductImage(index) {
      if (!confirm("ต้องการลบรูปภาพนี้ใช่หรือไม่?")) return;
      editingProductData.images.splice(index, 1);
      renderEditProductImages();
    }

    function closeEditProdModal() { document.getElementById('edit-prod-modal').classList.add('hidden'); }

    async function saveEditProduct() {
      const id = document.getElementById('edit-prod-id').value;
      const title = document.getElementById('edit-prod-title').value;
      const coverFile = document.getElementById('edit-prod-cover').files[0];
      const newFiles = document.getElementById('edit-prod-new-images').files;

      if (!title) return alert("กรุณาระบุชื่อสินค้า");

      const btn = document.getElementById('btn-save-prod');
      btn.innerText = "กำลังบันทึก...";

      try {
        let updateData = { title };
        if (coverFile) {
          const compressedCover = await imageCompression(coverFile, { maxSizeMB: 0.5, maxWidthOrHeight: 1000, useWebWorker: true });
          const coverFileName = `prod_cover_${Date.now()}.webp`;
          const { error: coverErr } = await supabaseClient.storage.from('product-images').upload(coverFileName, compressedCover);
          if (coverErr) throw coverErr;
          updateData.cover_url = `${SUPABASE_URL}/storage/v1/object/public/product-images/${coverFileName}`;
          updateData.image_url = updateData.cover_url;
        }

        const { error: updateErr } = await supabaseClient.from('products').update(updateData).eq('id', id);
        if (updateErr) throw updateErr;

        await supabaseClient.from('product_images').delete().eq('product_id', id);

        for (let i = 0; i < editingProductData.images.length; i++) {
          const img = editingProductData.images[i];
          await supabaseClient.from('product_images').insert([{
            product_id: id,
            image_url: img.image_url,
            sort_order: i
          }]);
        }

        if (newFiles.length > 0) {
          const startOrder = editingProductData.images.length;
          for (let i = 0; i < newFiles.length; i++) {
            const compressed = await imageCompression(newFiles[i], { maxSizeMB: 0.7, maxWidthOrHeight: 2000, useWebWorker: true });
            const fileName = `a4_${id}_${Date.now()}_${i}.webp`;
            const { error: uploadErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressed);
            if (uploadErr) throw uploadErr;

            const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
            await supabaseClient.from('product_images').insert([{ 
              product_id: id, 
              image_url: imageUrl, 
              sort_order: startOrder + i 
            }]);
          }
        }

        closeEditProdModal();
        btn.innerText = "บันทึกการแก้ไข";
        loadCategoryProducts(currentCategoryId);
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.innerText = "บันทึกการแก้ไข";
      }
    }

    function openA4Modal(title, images) {
      activeModalImages = Array.isArray(images) ? images : [images];
      modalImageIndex = 0;
      document.getElementById('modal-title').innerText = title;
      updateModalImageDisplay();
      document.getElementById('a4-modal').classList.remove('hidden');
    }

    function updateModalImageDisplay() {
      document.getElementById('modal-img-a4').src = activeModalImages[modalImageIndex];
      document.getElementById('modal-counter').innerText = `${modalImageIndex + 1} / ${activeModalImages.length}`;
      const nav = document.getElementById('modal-nav');
      if (activeModalImages.length > 1) nav.classList.remove('hidden');
      else nav.classList.add('hidden');
    }

    function nextModalImg() {
      if (modalImageIndex < activeModalImages.length - 1) { modalImageIndex++; updateModalImageDisplay(); }
    }
    function prevModalImg() {
      if (modalImageIndex > 0) { modalImageIndex--; updateModalImageDisplay(); }
    }
    function closeA4Modal() { document.getElementById('a4-modal').classList.add('hidden'); }

    async function toggleActive(id, currentStatus) {
      await supabaseClient.from('products').update({ is_active: !currentStatus }).eq('id', id);
      loadCategoryProducts(currentCategoryId);
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = currentCategoryProducts.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    async function deleteProduct(id) {
      if (confirm("ยืนยันการลบรายการสินค้านี้ทั้งหมด?")) {
        await supabaseClient.from('products').delete().eq('id', id);
        loadCategoryProducts(currentCategoryId);
      }
    }

    init();
  </script>
</body>
</html>
