<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Studio - ระบบจัดการสินค้า A4</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .draggable-card { cursor: grab; }
    .draggable-card:active { cursor: grabbing; }
    .dragging { opacity: 0.4; border: 2px dashed #6366f1 !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="min-h-screen flex flex-col">
    <!-- Top Nav -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="bg-indigo-600 text-white p-2 rounded-xl">
            <i data-lucide="layout-grid" class="w-5 h-5"></i>
          </div>
          <div>
            <span class="font-bold text-lg text-slate-900 block leading-tight">Admin Studio</span>
            <span class="text-xs text-slate-400">ระบบจัดการหมวดหมู่และใบสินค้า A4</span>
          </div>
        </div>
        <button id="btn-back-main" onclick="showCategoryView()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>กลับไปหน้าหมวดหมู่</span>
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
      
      <!-- LEVEL 1: หน้าแสดงหมวดหมู่ทั้งหมด -->
      <div id="section-categories" class="space-y-8">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 max-w-2xl mx-auto">
          <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
            <i data-lucide="folder-plus" class="w-5 h-5 text-indigo-600"></i>
            เพิ่มหมวดหมู่ใหม่
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ชื่อหมวดหมู่</label>
              <input type="text" id="cat-name" placeholder="เช่น Sticker Barcode" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ภาพปกหมวดหมู่</label>
              <input type="file" id="cat-image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
            </div>
          </div>
          <button onclick="addCategory()" id="btn-add-cat" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-md shadow-indigo-100 flex items-center justify-center gap-2 text-sm">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span id="btn-add-cat-text">บันทึกหมวดหมู่</span>
          </button>
        </div>

        <div>
          <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i data-lucide="folder" class="w-5 h-5 text-indigo-600"></i>
            หมวดหมู่ทั้งหมด
          </h3>
          <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-slate-400 text-sm col-span-full text-center py-8">กำลังโหลดหมวดหมู่...</p>
          </div>
        </div>
      </div>

      <!-- LEVEL 2: หน้าแสดงรายการสินค้าภายในหมวดหมู่ -->
      <div id="section-products" class="hidden space-y-8">
        <div class="bg-indigo-900 text-white p-6 rounded-3xl shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <span class="text-xs text-indigo-200 font-semibold uppercase tracking-wider">หมวดหมู่ปัจจุบัน</span>
            <h2 id="current-cat-title" class="text-2xl font-bold">ชื่อหมวดหมู่</h2>
          </div>
          <button onclick="showCategoryView()" class="bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-4 py-2 rounded-xl backdrop-blur-md transition flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> เลือกหมวดหมู่อื่น
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 sticky top-24">
              <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i>
                อัปโหลดสินค้าใหม่ (หลายรูป A4)
              </h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ชื่อ / รหัสสินค้า</label>
                  <input type="text" id="p-title" placeholder="เช่น สติ๊กเกอร์บาร์โค้ด 3.2x2.5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ภาพปกสินค้า (ถ้ามี)</label>
                  <input type="file" id="p-cover" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ไฟล์รูปภาพ A4 (เลือกได้หลายรูป)</label>
                  <input type="file" id="p-images" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
                </div>
                <button onclick="addProduct()" id="btn-upload" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 text-sm">
                  <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                  <span id="upload-btn-text">บีบอัดและอัปโหลดเข้าหมวดนี้</span>
                </button>
              </div>
            </div>
          </div>

          <div class="lg:col-span-2 space-y-4">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="files" class="w-5 h-5 text-indigo-600"></i>
                  รายการสินค้าในหมวดนี้
                </h3>
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="ค้นหารายการ..." class="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <p class="text-slate-400 text-sm col-span-full text-center py-8">กำลังโหลดรายการ...</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal ป๊อบอัพแสดงรูปภาพสินค้า -->
  <div id="a4-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="relative max-w-3xl w-full max-h-[92vh] bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-sm truncate pr-4">แสดงรูปภาพสินค้า A4</h3>
        <button onclick="closeA4Modal()" class="bg-slate-800 hover:bg-slate-700 text-white p-1.5 rounded-xl transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="overflow-y-auto p-4 flex-grow flex items-center justify-center bg-slate-200/60">
        <div class="w-full max-w-xl aspect-[1/1.414] bg-white shadow-xl rounded-xl overflow-hidden border border-slate-300 relative flex items-center justify-center">
          <img id="modal-img-a4" src="" class="w-full h-full object-contain">
        </div>
      </div>
      <div id="modal-nav" class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-white">
        <button onclick="prevModalImg()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold">รูปก่อนหน้า</button>
        <span id="modal-counter" class="text-xs text-slate-300">1 / 1</span>
        <button onclick="nextModalImg()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold">รูปถัดไป</button>
      </div>
    </div>
  </div>

  <!-- MODAL: แก้ไขหมวดหมู่ -->
  <div id="edit-cat-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
          <i data-lucide="edit-3" class="w-5 h-5 text-indigo-600"></i> แก้ไขหมวดหมู่
        </h3>
        <button onclick="closeEditCatModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <input type="hidden" id="edit-cat-id">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ชื่อหมวดหมู่</label>
        <input type="text" id="edit-cat-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">เปลี่ยนภาพปก (ถ้าไม่เปลี่ยนให้เว้นว่างไว้)</label>
        <input type="file" id="edit-cat-image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeEditCatModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200">ยกเลิก</button>
        <button onclick="saveEditCategory()" id="btn-save-cat" class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-md shadow-indigo-100">บันทึกการแก้ไข</button>
      </div>
    </div>
  </div>

  <!-- MODAL: แก้ไขสินค้า -->
  <div id="edit-prod-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
          <i data-lucide="edit-3" class="w-5 h-5 text-indigo-600"></i> แก้ไขรายการสินค้า & จัดการรูปภาพ
        </h3>
        <button onclick="closeEditProdModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <input type="hidden" id="edit-prod-id">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ชื่อ / รหัสสินค้า</label>
        <input type="text" id="edit-prod-title" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">เปลี่ยนภาพปกสินค้า (ถ้าไม่เปลี่ยนให้เว้นว่างไว้)</label>
        <input type="file" id="edit-prod-cover" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">รูปภาพปัจจุบัน (ลากวางสลับตำแหน่ง หรือกดปุ่มลูกศร)</label>
        <div id="edit-prod-images-container" class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200 max-h-64 overflow-y-auto"></div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">อัปโหลดรูปภาพ A4 เพิ่มเติม</label>
        <input type="file" id="edit-prod-new-images" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl cursor-pointer">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeEditProdModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200">ยกเลิก</button>
        <button onclick="saveEditProduct()" id="btn-save-prod" class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-md shadow-indigo-100">บันทึกการแก้ไข</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yzfjddyrewgajrvymhin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmpkZHlyZXdnYWpydnltaGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTUxNjcsImV4cCI6MjEwMzQ3MTE2N30.C0n2fy1qw0E2qdHzLeid1QnkUuotxyHPD7Nb6gyZzmk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categories = [];
    let currentCategoryId = null;
    let currentCategoryProducts = [];
    
    let activeModalImages = [];
    let modalImageIndex = 0;
    let editingProductData = null;
    let imagesToDeleteFromStorage = [];

    lucide.createIcons();

    function getStoragePath(url) {
      if (!url) return null;
      const parts = url.split('/product-images/');
      return parts.length > 1 ? parts[1] : null;
    }

    async function init() {
      await loadCategories();
    }

    async function loadCategories() {
      const { data, error } = await supabaseClient.from('categories').select('*').order('id', { ascending: false });
      if (error) return alert("ดึงข้อมูลหมวดหมู่ล้มเหลว: " + error.message);
      categories = data || [];
      renderCategories(categories);
    }

    function renderCategories(items) {
      const grid = document.getElementById('category-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-8">ยังไม่มีหมวดหมู่</p>`;
        return;
      }

      grid.innerHTML = items.map(c => `
        <div onclick="openCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')" class="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 cursor-pointer group flex flex-col">
          <div class="h-44 bg-slate-50 relative overflow-hidden flex items-center justify-center p-2 border-b border-slate-100">
            ${c.cover_url 
              ? `<img src="${c.cover_url}" class="w-full h-full object-contain group-hover:scale-105 transition duration-500">` 
              : `<div class="w-full h-full flex flex-col items-center justify-center text-slate-300 bg-slate-50"><i data-lucide="folder" class="w-10 h-10 mb-1"></i><span class="text-xs">ไม่มีภาพปก</span></div>`
            }
            <div class="absolute top-2 right-2 flex gap-1 z-10">
              <button onclick="event.stopPropagation(); openEditCatModal(${c.id})" class="bg-blue-600/80 hover:bg-blue-600 text-white p-1.5 rounded-lg backdrop-blur-md transition shadow"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
              <button onclick="event.stopPropagation(); deleteCategory(${c.id})" class="bg-red-600/80 hover:bg-red-600 text-white p-1.5 rounded-lg backdrop-blur-md transition shadow"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
          <div class="p-4 flex-grow flex items-center justify-between">
            <div>
              <h4 class="font-bold text-slate-900 text-base group-hover:text-indigo-600 transition">${c.name}</h4>
              <p class="text-xs text-slate-400 mt-0.5">กดเพื่อเข้าดูรายการ</p>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:text-indigo-600"></i>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function addCategory() {
      const name = document.getElementById('cat-name').value.trim();
      const fileInput = document.getElementById('cat-image');
      const file = fileInput.files[0];
      if (!name) return alert("กรุณาระบุชื่อหมวดหมู่");

      const btnText = document.getElementById('btn-add-cat-text');
      btnText.innerText = "กำลังบันทึก...";

      try {
        let coverUrl = null;
        if (file) {
          const compressedFile = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 1200, useWebWorker: true });
          const fileName = `cover_${Date.now()}.webp`;
          const { error: imgErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressedFile);
          if (imgErr) throw imgErr;
          coverUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
        }

        const { error } = await supabaseClient.from('categories').insert([{ name, cover_url: coverUrl }]);
        if (error) throw error;

        document.getElementById('cat-name').value = '';
        fileInput.value = '';
        btnText.innerText = "บันทึกหมวดหมู่";
        loadCategories();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btnText.innerText = "บันทึกหมวดหมู่";
      }
    }

    function openEditCatModal(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;
      document.getElementById('edit-cat-id').value = cat.id;
      document.getElementById('edit-cat-name').value = cat.name;
      document.getElementById('edit-cat-image').value = '';
      document.getElementById('edit-cat-modal').classList.remove('hidden');
    }

    function closeEditCatModal() { document.getElementById('edit-cat-modal').classList.add('hidden'); }

    async function saveEditCategory() {
      const id = document.getElementById('edit-cat-id').value;
      const name = document.getElementById('edit-cat-name').value.trim();
      const fileInput = document.getElementById('edit-cat-image');
      const file = fileInput.files[0];
      if (!name) return alert("กรุณาระบุชื่อหมวดหมู่");

      const btn = document.getElementById('btn-save-cat');
      btn.innerText = "กำลังบันทึก...";
      try {
        let updateData = { name };
        if (file) {
          const oldCat = categories.find(c => c.id == id);
          if (oldCat && oldCat.cover_url) {
            const path = getStoragePath(oldCat.cover_url);
            if (path) await supabaseClient.storage.from('product-images').remove([path]);
          }

          const compressedFile = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 1200, useWebWorker: true });
          const fileName = `cover_${Date.now()}.webp`;
          const { error: imgErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressedFile);
          if (imgErr) throw imgErr;
          updateData.cover_url = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
        }

        const { error } = await supabaseClient.from('categories').update(updateData).eq('id', id);
        if (error) throw error;
        closeEditCatModal();
        btn.innerText = "บันทึกการแก้ไข";
        loadCategories();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.innerText = "บันทึกการแก้ไข";
      }
    }

    async function deleteCategory(id) {
      if (!confirm("ยืนยันการลบหมวดหมู่นี้? รายการสินค้าข้างในอาจได้รับผลกระทบ")) return;
      
      const cat = categories.find(c => c.id === id);
      if (cat && cat.cover_url) {
        const path = getStoragePath(cat.cover_url);
        if (path) await supabaseClient.storage.from('product-images').remove([path]);
      }

      await supabaseClient.from('categories').delete().eq('id', id);
      loadCategories();
    }

    function openCategory(catId, catName) {
      currentCategoryId = catId;
      document.getElementById('current-cat-title').innerText = catName;
      document.getElementById('section-categories').classList.add('hidden');
      document.getElementById('section-products').classList.remove('hidden');
      document.getElementById('btn-back-main').classList.remove('hidden');
      loadCategoryProducts(catId);
    }

    function showCategoryView() {
      currentCategoryId = null;
      document.getElementById('section-categories').classList.remove('hidden');
      document.getElementById('section-products').classList.add('hidden');
      document.getElementById('btn-back-main').classList.add('hidden');
    }

    async function loadCategoryProducts(catId) {
      const { data: products, error } = await supabaseClient
        .from('products')
        .select(`
          *,
          product_images ( id, image_url, sort_order )
        `)
        .eq('category_id', catId)
        .order('id', { ascending: false });

      if (error) return alert("เกิดข้อผิดพลาดในการดึงข้อมูลสินค้า: " + error.message);

      currentCategoryProducts = (products || []).map(p => {
        let prodImgs = (p.product_images || []).sort((a, b) => a.sort_order - b.sort_order);
        if (prodImgs.length === 0 && p.image_url) {
          prodImgs.push({ id: 'legacy', image_url: p.image_url, sort_order: 0 });
        }
        return { ...p, images: prodImgs };
      });

      renderProducts(currentCategoryProducts);
    }

    function renderProducts(items) {
      const list = document.getElementById('product-list');
      if (items.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ยังไม่มีรายการในหมวดนี้</p>`;
        return;
      }

      list.innerHTML = items.map(p => {
        const coverImg = p.cover_url || p.image_url || p.images[0]?.image_url || 'https://via.placeholder.com/400x500?text=No+Image';
        const imgCount = p.images.length;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm relative group flex flex-col justify-between">
            <div>
              <div onclick="openA4ModalByProdId(${p.id})" class="aspect-[1/1.414] rounded-xl overflow-hidden bg-slate-50 mb-2 border border-slate-200 relative cursor-pointer group-hover:opacity-95 transition flex items-center justify-center p-1">
                <img src="${coverImg}" class="w-full h-full object-contain">
                <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-medium gap-1 rounded-xl">
                  <i data-lucide="maximize-2" class="w-4 h-4"></i> ดู A4 (${imgCount} หน้า)
                </div>
                ${imgCount > 1 ? `<span class="absolute top-2 left-2 bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">${imgCount} รูป</span>` : ''}
              </div>
              <h4 class="font-bold text-xs text-slate-800 truncate mb-2">${p.title}</h4>
            </div>
            
            <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-100">
              <button onclick="toggleActive(${p.id}, ${p.is_active})" title="${p.is_active ? 'ซ่อน' : 'แสดง'}" class="col-span-1 ${p.is_active ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'} text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="${p.is_active ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="openEditProdModal(${p.id})" title="แก้ไข" class="col-span-1 bg-blue-50 text-blue-600 hover:bg-blue-100 text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteProduct(${p.id})" title="ลบ" class="col-span-1 bg-red-50 text-red-600 hover:bg-red-100 text-[11px] py-1.5 rounded-lg font-medium transition flex items-center justify-center">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function addProduct() {
      const title = document.getElementById('p-title').value.trim();
      const coverInput = document.getElementById('p-cover');
      const coverFile = coverInput ? coverInput.files[0] : null;
      const fileInput = document.getElementById('p-images');
      const files = fileInput.files;

      if (!title || (files.length === 0 && !coverFile)) {
        return alert("กรุณากรอกชื่อรายการและเลือกรูปภาพอย่างน้อย 1 รูป");
      }

      const btnText = document.getElementById('upload-btn-text');
      btnText.innerText = "กำลังอัปโหลด...";

      try {
        let coverUrl = '';
        if (coverFile) {
          const compressedCover = await imageCompression(coverFile, { maxSizeMB: 0.5, maxWidthOrHeight: 1200, useWebWorker: true });
          const coverFileName = `cover_prod_${Date.now()}.webp`;
          const { error: coverErr } = await supabaseClient.storage.from('product-images').upload(coverFileName, compressedCover);
          if (coverErr) throw coverErr;
          coverUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${coverFileName}`;
        }

        const { data: prodData, error: prodErr } = await supabaseClient.from('products').insert([{ 
          title, 
          category_id: currentCategoryId, 
          image_url: coverUrl, 
          cover_url: coverUrl,
          is_active: true 
        }]).select();

        if (prodErr) throw prodErr;
        const newProductId = prodData[0].id;

        for (let i = 0; i < files.length; i++) {
          const compressed = await imageCompression(files[i], { maxSizeMB: 0.7, maxWidthOrHeight: 2000, useWebWorker: true });
          const fileName = `a4_${newProductId}_${Date.now()}_${i}.webp`;
          const { error: uploadErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressed);
          if (uploadErr) throw uploadErr;

          const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
          await supabaseClient.from('product_images').insert([{ product_id: newProductId, image_url: imageUrl, sort_order: i }]);
        }

        document.getElementById('p-title').value = '';
        if (coverInput) coverInput.value = '';
        fileInput.value = '';
        btnText.innerText = "บีบอัดและอัปโหลดเข้าหมวดนี้";
        loadCategoryProducts(currentCategoryId);
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btnText.innerText = "บีบอัดและอัปโหลดเข้าหมวดนี้";
      }
    }

    function openEditProdModal(productId) {
      const prod = currentCategoryProducts.find(p => p.id === productId);
      if (!prod) return;
      editingProductData = JSON.parse(JSON.stringify(prod));
      imagesToDeleteFromStorage = [];

      document.getElementById('edit-prod-id').value = prod.id;
      document.getElementById('edit-prod-title').value = prod.title;
      const coverInput = document.getElementById('edit-prod-cover');
      if (coverInput) coverInput.value = '';
      document.getElementById('edit-prod-new-images').value = '';

      renderEditProductImages();
      document.getElementById('edit-prod-modal').classList.remove('hidden');
    }

    function renderEditProductImages() {
      const container = document.getElementById('edit-prod-images-container');
      if (!editingProductData || editingProductData.images.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 col-span-full text-center py-4">ยังไม่มีรูปภาพ</p>`;
        return;
      }

      container.innerHTML = editingProductData.images.map((img, idx) => `
        <div draggable="true" ondragstart="handleDragStart(event, ${idx})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${idx})" class="draggable-card bg-white p-3 rounded-2xl border border-slate-200 flex items-center gap-3 shadow-sm transition hover:border-indigo-300">
          <div class="text-slate-400 font-bold text-sm cursor-grab px-1">☰</div>
          <div class="w-16 h-20 bg-slate-50 rounded-lg overflow-hidden flex-shrink-0 border border-slate-200 flex items-center justify-center p-0.5">
            <img src="${img.image_url}" class="w-full h-full object-contain pointer-events-none">
          </div>
          <div class="flex-grow flex flex-col justify-between h-20">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-700">หน้า A4 ที่ ${idx + 1}</span>
              <button onclick="deleteSingleProductImage(${idx})" type="button" class="text-red-500 hover:text-red-700 p-1" title="ลบรูปนี้">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="flex items-center gap-1.5 pt-1">
              <button onclick="moveImageIndex(${idx}, -1)" type="button" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] py-1 px-2 rounded-lg font-medium transition flex items-center justify-center gap-1 ${idx === 0 ? 'opacity-45' : ''}">
                <i data-lucide="arrow-up" class="w-3 h-3"></i> เลื่อนขึ้น
              </button>
              <button onclick="moveImageIndex(${idx}, 1)" type="button" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] py-1 px-2 rounded-lg font-medium transition flex items-center justify-center gap-1 ${idx === editingProductData.images.length - 1 ? 'opacity-45' : ''}">
                เลื่อนลง <i data-lucide="arrow-down" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    let draggedIndex = null;
    function handleDragStart(e, index) { draggedIndex = index; e.target.classList.add('dragging'); }
    function handleDragOver(e) { e.preventDefault(); }
    function handleDrop(e, targetIndex) {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === targetIndex) return;
      const movedItem = editingProductData.images.splice(draggedIndex, 1)[0];
      editingProductData.images.splice(targetIndex, 0, movedItem);
      draggedIndex = null;
      renderEditProductImages();
    }

    function moveImageIndex(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= editingProductData.images.length) return;
      const temp = editingProductData.images[index];
      editingProductData.images[index] = editingProductData.images[targetIndex];
      editingProductData.images[targetIndex] = temp;
      renderEditProductImages();
    }

    function deleteSingleProductImage(index) {
      if (!confirm("ต้องการลบรูปภาพนี้ใช่หรือไม่?")) return;
      const removedImg = editingProductData.images.splice(index, 1)[0];
      if (removedImg && removedImg.image_url) {
        const path = getStoragePath(removedImg.image_url);
        if (path) imagesToDeleteFromStorage.push(path);
      }
      renderEditProductImages();
    }

    function closeEditProdModal() { document.getElementById('edit-prod-modal').classList.add('hidden'); }

    async function saveEditProduct() {
      const id = document.getElementById('edit-prod-id').value;
      const title = document.getElementById('edit-prod-title').value.trim();
      const coverInput = document.getElementById('edit-prod-cover');
      const coverFile = coverInput ? coverInput.files[0] : null;
      const newFiles = document.getElementById('edit-prod-new-images').files;

      if (!title) return alert("กรุณาระบุชื่อสินค้า");

      const btn = document.getElementById('btn-save-prod');
      btn.innerText = "กำลังบันทึก...";

      try {
        // 1. ลบไฟล์ภาพ A4 ใน Storage ที่โดนสั่งลบ
        if (imagesToDeleteFromStorage.length > 0) {
          await supabaseClient.storage.from('product-images').remove(imagesToDeleteFromStorage);
        }

        let updateData = { title };

        // 2. อัปเดตภาพปกสินค้าใหม่ (ถ้ามีการเลือกไฟล์ใหม่)
        if (coverFile) {
          const oldProd = currentCategoryProducts.find(p => p.id == id);
          const oldCover = oldProd?.cover_url || oldProd?.image_url;
          if (oldCover) {
            const path = getStoragePath(oldCover);
            if (path) await supabaseClient.storage.from('product-images').remove([path]);
          }
          const compressedCover = await imageCompression(coverFile, { maxSizeMB: 0.5, maxWidthOrHeight: 1200, useWebWorker: true });
          const coverFileName = `cover_prod_${Date.now()}.webp`;
          const { error: coverErr } = await supabaseClient.storage.from('product-images').upload(coverFileName, compressedCover);
          if (coverErr) throw coverErr;
          const coverUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${coverFileName}`;
          updateData.cover_url = coverUrl;
          updateData.image_url = coverUrl;
        }

        const { error: updateErr } = await supabaseClient.from('products').update(updateData).eq('id', id);
        if (updateErr) throw updateErr;

        // 3. รีเซ็ตและเรียงลำดับรูปเดิมใหม่
        await supabaseClient.from('product_images').delete().eq('product_id', id);

        for (let i = 0; i < editingProductData.images.length; i++) {
          const img = editingProductData.images[i];
          await supabaseClient.from('product_images').insert([{
            product_id: id,
            image_url: img.image_url,
            sort_order: i
          }]);
        }

        // 4. อัปโหลดรูป A4 ใหม่เพิ่มเติม (ถ้ามี)
        if (newFiles.length > 0) {
          const startOrder = editingProductData.images.length;
          for (let i = 0; i < newFiles.length; i++) {
            const compressed = await imageCompression(newFiles[i], { maxSizeMB: 0.7, maxWidthOrHeight: 2000, useWebWorker: true });
            const fileName = `a4_${id}_${Date.now()}_${i}.webp`;
            const { error: uploadErr } = await supabaseClient.storage.from('product-images').upload(fileName, compressed);
            if (uploadErr) throw uploadErr;

            const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
            await supabaseClient.from('product_images').insert([{ 
              product_id: id, 
              image_url: imageUrl, 
              sort_order: startOrder + i 
            }]);
          }
        }

        closeEditProdModal();
        btn.innerText = "บันทึกการแก้ไข";
        loadCategoryProducts(currentCategoryId);
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.innerText = "บันทึกการแก้ไข";
      }
    }

    function openA4ModalByProdId(prodId) {
      const prod = currentCategoryProducts.find(p => p.id === prodId);
      if (!prod) return;
      activeModalImages = prod.images.map(i => i.image_url);
      modalImageIndex = 0;
      document.getElementById('modal-title').innerText = prod.title;
      updateModalImageDisplay();
      document.getElementById('a4-modal').classList.remove('hidden');
    }

    function updateModalImageDisplay() {
      document.getElementById('modal-img-a4').src = activeModalImages[modalImageIndex];
      document.getElementById('modal-counter').innerText = `${modalImageIndex + 1} / ${activeModalImages.length}`;
      const nav = document.getElementById('modal-nav');
      if (activeModalImages.length > 1) nav.classList.remove('hidden');
      else nav.classList.add('hidden');
    }

    function nextModalImg() {
      if (modalImageIndex < activeModalImages.length - 1) {
        modalImageIndex++;
        updateModalImageDisplay();
      }
    }

    function prevModalImg() {
      if (modalImageIndex > 0) {
        modalImageIndex--;
        updateModalImageDisplay();
      }
    }

    function closeA4Modal() { document.getElementById('a4-modal').classList.add('hidden'); }

    async function toggleActive(id, currentStatus) {
      await supabaseClient.from('products').update({ is_active: !currentStatus }).eq('id', id);
      loadCategoryProducts(currentCategoryId);
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = currentCategoryProducts.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    async function deleteProduct(id) {
      if (!confirm("ยืนยันการลบรายการสินค้านี้ทั้งหมด?")) return;
      
      const prod = currentCategoryProducts.find(p => p.id === id);
      if (prod) {
        let paths = [];
        if (prod.images && prod.images.length > 0) {
          paths = prod.images.map(img => getStoragePath(img.image_url)).filter(Boolean);
        }
        const coverPath = getStoragePath(prod.cover_url || prod.image_url);
        if (coverPath && !paths.includes(coverPath)) {
          paths.push(coverPath);
        }
        if (paths.length > 0) {
          await supabaseClient.storage.from('product-images').remove(paths);
        }
      }

      await supabaseClient.from('products').delete().eq('id', id);
      loadCategoryProducts(currentCategoryId);
    }

    init();
  </script>
</body>
</html>
