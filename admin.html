<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ระบบจัดการหมวดหมู่และสินค้า A4</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .bg-dots-pattern {
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative antialiased bg-dots-pattern pb-16">

  <!-- Glow Decorative Effects -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-tr from-purple-200/40 via-blue-100/40 to-sky-200/40 blur-3xl pointer-events-none -z-10"></div>

  <!-- Header Bar -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center shadow-md shadow-purple-500/20">
          <span class="font-bold text-base">A</span>
        </div>
        <div>
          <span class="font-bold text-sm text-slate-900 block leading-tight">Admin Dashboard</span>
          <span class="text-[11px] text-slate-500 font-medium">ระบบจัดการหมวดหมู่และสินค้า</span>
        </div>
      </div>
      
      <button id="btn-back-cat" onclick="showCategoryManager()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2 border border-slate-200">
        <i data-lucide="arrow-left" class="w-4 h-4 text-slate-500"></i>
        <span>กลับไปหน้าหมวดหมู่</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
    
    <!-- SECTION 1: CATEGORY MANAGER -->
    <div id="section-categories" class="space-y-6">
      <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200/80 space-y-6">
        <div>
          <span class="text-[11px] font-semibold px-3 py-1 bg-purple-50 text-purple-600 rounded-full border border-purple-100 uppercase tracking-wider">Category Management</span>
          <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-2">จัดการหมวดหมู่สินค้า</h2>
          <p class="text-xs text-slate-500 mt-1">สร้างและจัดการหมวดหมู่ พร้อมรูปปกสำหรับแสดงผลในหน้าแรก</p>
        </div>

        <form id="form-category" onsubmit="handleCategorySubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-slate-50 p-5 rounded-2xl border border-slate-200/60">
          <input type="hidden" id="cat-id">
          <div class="md:col-span-5 space-y-1.5">
            <label class="text-xs font-bold text-slate-700">ชื่อหมวดหมู่</label>
            <input type="text" id="cat-name" required placeholder="เช่น สติ๊กเกอร์, ป้ายสินค้า, เมนูอาหาร" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>
          <div class="md:col-span-5 space-y-1.5">
            <label class="text-xs font-bold text-slate-700">รูปปกหมวดหมู่ (Cover)</label>
            <input type="file" id="cat-cover-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer">
          </div>
          <div class="md:col-span-2 flex gap-2">
            <button type="submit" id="btn-save-cat" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold shadow-md shadow-purple-500/20 transition">บันทึก</button>
            <button type="button" id="btn-cancel-cat" onclick="resetCategoryForm()" class="hidden py-2.5 px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition">ยกเลิก</button>
          </div>
        </form>
      </div>

      <div>
        <h3 class="font-bold text-slate-900 text-base mb-4 flex items-center gap-2">
          <span class="w-2 h-5 bg-purple-600 rounded-full"></span> หมวดหมู่ทั้งหมด
        </h3>
        <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <p class="text-slate-400 text-xs col-span-full text-center py-12">กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </div>

    <!-- SECTION 2: PRODUCT MANAGER -->
    <div id="section-products" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <span class="text-[11px] font-semibold px-3 py-1 bg-sky-50 text-sky-600 rounded-full border border-sky-100 uppercase tracking-wider">Product Management</span>
            <h2 id="current-cat-title" class="text-xl font-extrabold text-slate-900 mt-2">ชื่อหมวดหมู่</h2>
          </div>
          <div class="relative w-full sm:w-64">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="ค้นหารายการสินค้า..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>

        <form id="form-product" onsubmit="handleProductSubmit(event)" class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-end bg-slate-50 p-5 rounded-2xl border border-slate-200/60">
          <input type="hidden" id="prod-id">
          <div class="lg:col-span-4 space-y-1.5">
            <label class="text-xs font-bold text-slate-700">ชื่อรายการสินค้า</label>
            <input type="text" id="prod-title" required placeholder="เช่น สติ๊กเกอร์กันน้ำ 5x5 ซม." class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div class="lg:col-span-3 space-y-1.5">
            <label class="text-xs font-bold text-slate-700">รูปปกสินค้า (แสดงหน้าหลัก)</label>
            <input type="file" id="prod-cover-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
          </div>
          <div class="lg:col-span-3 space-y-1.5">
            <label class="text-xs font-bold text-slate-700">รูปภาพ A4 ด้านใน (เลือกได้หลายรูป)</label>
            <input type="file" id="prod-images-file" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
          </div>
          <div class="lg:col-span-2 flex gap-2">
            <button type="submit" id="btn-save-prod" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow-md shadow-sky-500/20 transition">บันทึก</button>
            <button type="button" id="btn-cancel-prod" onclick="resetProductForm()" class="hidden py-2.5 px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition">ยกเลิก</button>
          </div>
        </form>
      </div>

      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
        <p class="text-slate-400 text-xs col-span-full text-center py-12">กำลังโหลดสินค้า...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://yzfjddyrewgajrvymhin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmpkZHlyZXdnYWpydnltaGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTUxNjcsImV4cCI6MjEwMzQ3MTE2N30.C0n2fy1qw0E2qdHzLeid1QnkUuotxyHPD7Nb6gyZzmk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeCategory = null;
    let categoriesList = [];
    let productsList = [];

    lucide.createIcons();

    async function init() {
      await loadCategories();
    }

    async function loadCategories() {
      const { data } = await supabaseClient.from('categories').select('*').order('id', { ascending: false });
      categoriesList = data || [];
      renderCategories(categoriesList);
    }

    function renderCategories(items) {
      const grid = document.getElementById('category-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-xs col-span-full text-center py-12">ยังไม่มีหมวดหมู่สินค้า</p>`;
        return;
      }

      grid.innerHTML = items.map(c => `
        <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm hover:shadow-xl transition duration-300 flex flex-col justify-between overflow-hidden group">
          <div onclick="openCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')" class="cursor-pointer">
            <div class="h-44 bg-slate-50 relative flex items-center justify-center p-3 border-b border-slate-100">
              ${c.cover_url ? `<img src="${c.cover_url}" class="w-full h-full object-contain">` : `<i data-lucide="image" class="w-8 h-8 text-slate-300"></i>`}
            </div>
            <div class="p-4">
              <h4 class="font-bold text-slate-900 text-sm truncate group-hover:text-purple-600 transition">${c.name}</h4>
            </div>
          </div>
          <div class="px-4 pb-4 pt-0 flex items-center justify-between border-t border-slate-100 pt-3">
            <button onclick="editCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}', '${c.cover_url || ''}')" class="text-xs text-slate-500 hover:text-purple-600 font-semibold flex items-center gap-1"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i> แก้ไข</button>
            <button onclick="deleteCategory(${c.id})" class="text-xs text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบ</button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function handleCategorySubmit(e) {
      e.preventDefault();
      const id = document.getElementById('cat-id').value;
      const name = document.getElementById('cat-name').value;
      const fileInput = document.getElementById('cat-cover-file');
      
      let cover_url = null;
      if (fileInput.files.length > 0) {
        cover_url = await uploadImage(fileInput.files[0], 'categories');
      }

      if (id) {
        const updateData = { name };
        if (cover_url) updateData.cover_url = cover_url;
        await supabaseClient.from('categories').update(updateData).eq('id', id);
      } else {
        await supabaseClient.from('categories').insert([{ name, cover_url: cover_url || '' }]);
      }

      resetCategoryForm();
      loadCategories();
    }

    function editCategory(id, name, coverUrl) {
      document.getElementById('cat-id').value = id;
      document.getElementById('cat-name').value = name;
      document.getElementById('btn-save-cat').innerText = 'อัปเดต';
      document.getElementById('btn-cancel-cat').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetCategoryForm() {
      document.getElementById('form-category').reset();
      document.getElementById('cat-id').value = '';
      document.getElementById('btn-save-cat').innerText = 'บันทึก';
      document.getElementById('btn-cancel-cat').classList.add('hidden');
    }

    async function deleteCategory(id) {
      if (confirm('ต้องการลบหมวดหมู่นี้หรือไม่?')) {
        await supabaseClient.from('categories').delete().eq('id', id);
        loadCategories();
      }
    }

    async function openCategory(id, name) {
      activeCategory = { id, name };
      document.getElementById('current-cat-title').innerText = name;
      document.getElementById('section-categories').classList.add('hidden');
      document.getElementById('section-products').classList.remove('hidden');
      document.getElementById('btn-back-cat').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      await loadProducts(id);
    }

    function showCategoryManager() {
      activeCategory = null;
      document.getElementById('section-categories').classList.remove('hidden');
      document.getElementById('section-products').classList.add('hidden');
      document.getElementById('btn-back-cat').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadProducts(catId) {
      const { data: products } = await supabaseClient.from('products').select('*').eq('category_id', catId).order('id', { ascending: false });
      const { data: images } = await supabaseClient.from('product_images').select('*').order('sort_order', { ascending: true });

      productsList = (products || []).map(p => {
        const prodImgs = (images || []).filter(img => img.product_id === p.id).map(img => img.image_url);
        if (prodImgs.length === 0 && p.image_url) prodImgs.push(p.image_url);
        const displayCover = p.cover_url || prodImgs[0] || 'https://via.placeholder.com/400x500?text=No+Image';
        return { ...p, images: prodImgs, displayCover };
      });

      renderProducts(productsList);
    }

    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-xs col-span-full text-center py-12">ยังไม่มีรายการสินค้าในหมวดหมู่นี้</p>`;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-xl transition duration-300 flex flex-col justify-between overflow-hidden group">
          <div>
            <!-- ปรับกรอบรูปสินค้าให้รองรับทุกสัดส่วนด้วย object-contain -->
            <div class="h-40 bg-slate-50 relative flex items-center justify-center p-2 border-b border-slate-100">
              <img src="${p.displayCover}" class="w-full h-full object-contain">
              <span class="absolute top-2 left-2 px-2 py-0.5 bg-sky-600 text-white text-[10px] font-bold rounded-md shadow">${p.images.length} รูป</span>
            </div>
            <div class="p-3 text-center bg-slate-50">
              <h4 class="font-bold text-slate-800 text-xs truncate">${p.title}</h4>
            </div>
          </div>
          <div class="px-3 pb-3 pt-2 flex items-center justify-between border-t border-slate-100">
            <button onclick="editProduct(${p.id}, '${p.title.replace(/'/g, "\\'")}')" class="text-[11px] text-slate-500 hover:text-sky-600 font-semibold flex items-center gap-1"><i data-lucide="edit-3" class="w-3 h-3"></i> แก้ไข</button>
            <button onclick="deleteProduct(${p.id})" class="text-[11px] text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i> ลบ</button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const title = document.getElementById('prod-title').value;
      const coverFile = document.getElementById('prod-cover-file').files[0];
      const imageFiles = document.getElementById('prod-images-file').files;

      let cover_url = null;
      if (coverFile) {
        cover_url = await uploadImage(coverFile, 'products');
      }

      let productId = id;
      if (id) {
        const updateData = { title };
        if (cover_url) updateData.cover_url = cover_url;
        await supabaseClient.from('products').update(updateData).eq('id', id);
      } else {
        const { data, error } = await supabaseClient.from('products').insert([{
          category_id: activeCategory.id,
          title,
          cover_url: cover_url || ''
        }]).select().single();
        if (data) productId = data.id;
      }

      if (imageFiles.length > 0) {
        for (let i = 0; i < imageFiles.length; i++) {
          const imgUrl = await uploadImage(imageFiles[i], 'products');
          if (imgUrl) {
            await supabaseClient.from('product_images').insert([{ product_id: productId, image_url: imgUrl, sort_order: i }]);
          }
        }
      }

      resetProductForm();
      loadProducts(activeCategory.id);
    }

    function editProduct(id, title) {
      document.getElementById('prod-id').value = id;
      document.getElementById('prod-title').value = title;
      document.getElementById('btn-save-prod').innerText = 'อัปเดต';
      document.getElementById('btn-cancel-prod').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetProductForm() {
      document.getElementById('form-product').reset();
      document.getElementById('prod-id').value = '';
      document.getElementById('btn-save-prod').innerText = 'บันทึก';
      document.getElementById('btn-cancel-prod').classList.add('hidden');
    }

    async function deleteProduct(id) {
      if (confirm('ต้องการลบรายการสินค้านี้หรือไม่?')) {
        await supabaseClient.from('product_images').delete().eq('product_id', id);
        await supabaseClient.from('products').delete().eq('id', id);
        loadProducts(activeCategory.id);
      }
    }

    async function uploadImage(file, bucketName) {
      const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { data, error } = await supabaseClient.storage.from(bucketName).upload(fileName, file);
      if (error) {
        alert('อัปโหลดรูปภาพไม่สำเร็จ: ' + error.message);
        return null;
      }
      const { data: publicUrlData } = supabaseClient.storage.from(bucketName).getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = productsList.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    init();
  </script>
</body>
</html>
