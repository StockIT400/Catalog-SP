<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog Studio - แค็ตตาล็อกสินค้าและชิ้นงานทั้งหมด</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-[#f2f9f6] text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-emerald-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showCategoryView()">
        <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-md shadow-emerald-200">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-xl text-slate-900 leading-tight">Catalog Studio</h1>
          <p class="text-xs text-slate-500">แค็ตตาล็อกสินค้าและชิ้นงานทั้งหมด</p>
        </div>
      </div>

      <button id="btn-back-categories" onclick="showCategoryView()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>กลับไปหน้าหมวดหมู่</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- LEVEL 1: หน้าแสดงหมวดหมู่ทั้งหมด -->
    <div id="section-categories" class="space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="folder-grid" class="w-5 h-5 text-emerald-600"></i>
          หมวดหมู่สินค้าทั้งหมด
        </h2>
      </div>

      <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <p class="text-slate-400 text-sm col-span-full text-center py-12">กำลังโหลดหมวดหมู่...</p>
      </div>
    </div>

    <!-- LEVEL 2: หน้าแสดงสินค้าในหมวดหมู่ที่เลือก -->
    <div id="section-products" class="hidden space-y-6">
      
      <!-- Filter & Search Bar -->
      <div class="bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-emerald-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 text-xs text-slate-400 font-medium mb-1">
            <span onclick="showCategoryView()" class="hover:text-emerald-600 cursor-pointer">หมวดหมู่</span>
            <i data-lucide="chevron-right" class="w-3 h-3"></i>
            <span id="breadcrumb-cat" class="text-emerald-600 font-semibold">ชื่อหมวดหมู่</span>
          </div>
          <h2 id="current-cat-title" class="text-2xl font-bold text-slate-900">ชื่อหมวดหมู่</h2>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <!-- ช่องค้นหา -->
          <div class="relative flex-grow sm:w-64">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="ค้นหาชื่อสินค้าในหมวดนี้..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <!-- ตัวเลือกการเรียงลำดับ -->
          <div class="flex items-center gap-2">
            <select id="sort-order" onchange="handleSortChange()" class="bg-slate-50 border border-slate-200 text-xs text-slate-700 py-2.5 px-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="asc">เรียงตาม: เก่าไปใหม่ (เดิมไปใหม่)</option>
              <option value="desc">เรียงตาม: ใหม่ไปเก่า (ใหม่ไปเดิม)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- รายการสินค้า Grid -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <p class="text-slate-400 text-sm col-span-full text-center py-12">กำลังโหลดรายการสินค้า...</p>
      </div>
    </div>

  </main>

  <!-- Modal สำหรับดูภาพ A4 ใหญ่ -->
  <div id="a4-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="relative max-w-3xl w-full max-h-[92vh] bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-sm truncate pr-4">แสดงรูปภาพสินค้า A4</h3>
        <button onclick="closeA4Modal()" class="bg-slate-800 hover:bg-slate-700 text-white p-1.5 rounded-xl transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="overflow-y-auto p-4 flex-grow flex items-center justify-center bg-slate-100">
        <div class="w-full max-w-xl aspect-[1/1.414] bg-white shadow-xl rounded-xl overflow-hidden border border-slate-300 relative flex items-center justify-center">
          <img id="modal-img-a4" src="" class="w-full h-full object-contain">
        </div>
      </div>
      <div id="modal-nav" class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-white">
        <button onclick="prevModalImg()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold transition">รูปก่อนหน้า</button>
        <span id="modal-counter" class="text-xs text-slate-300">1 / 1</span>
        <button onclick="nextModalImg()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold transition">รูปถัดไป</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yzfjddyrewgajrvymhin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmpkZHlyZXdnYWpydnltaGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTUxNjcsImV4cCI6MjEwMzQ3MTE2N30.C0n2fy1qw0E2qdHzLeid1QnkUuotxyHPD7Nb6gyZzmk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categories = [];
    let currentCategoryId = null;
    let currentCategoryProducts = [];
    
    let activeModalImages = [];
    let modalImageIndex = 0;

    lucide.createIcons();

    async function init() {
      await loadCategories();
    }

    // โหลดหมวดหมู่ทั้งหมด (เรียง เก่า -> ใหม่)
    async function loadCategories() {
      const { data, error } = await supabaseClient
        .from('categories')
        .select('*')
        .order('id', { ascending: true });

      if (error) return console.error("ดึงข้อมูลหมวดหมู่ล้มเหลว:", error.message);
      categories = data || [];
      renderCategories(categories);
    }

    function renderCategories(items) {
      const grid = document.getElementById('category-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ยังไม่มีหมวดหมู่สินค้า</p>`;
        return;
      }

      grid.innerHTML = items.map(c => `
        <div onclick="openCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')" class="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 cursor-pointer group flex flex-col">
          <div class="h-48 bg-slate-50 relative overflow-hidden flex items-center justify-center p-2 border-b border-slate-100">
            ${c.cover_url 
              ? `<img src="${c.cover_url}" class="w-full h-full object-contain group-hover:scale-105 transition duration-500">` 
              : `<div class="w-full h-full flex flex-col items-center justify-center text-slate-300 bg-slate-50"><i data-lucide="folder" class="w-12 h-12 mb-2"></i><span class="text-xs">ไม่มีภาพปก</span></div>`
            }
          </div>
          <div class="p-5 flex-grow flex items-center justify-between bg-white">
            <div>
              <h4 class="font-bold text-slate-900 text-base group-hover:text-emerald-600 transition">${c.name}</h4>
              <p class="text-xs text-slate-400 mt-1">คลิกเพื่อเข้าดูสินค้าในหมวด</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openCategory(catId, catName) {
      currentCategoryId = catId;
      document.getElementById('current-cat-title').innerText = catName;
      document.getElementById('breadcrumb-cat').innerText = catName;
      document.getElementById('section-categories').classList.add('hidden');
      document.getElementById('section-products').classList.remove('hidden');
      document.getElementById('btn-back-categories').classList.remove('hidden');
      loadCategoryProducts(catId);
    }

    function showCategoryView() {
      currentCategoryId = null;
      document.getElementById('section-categories').classList.remove('hidden');
      document.getElementById('section-products').classList.add('hidden');
      document.getElementById('btn-back-categories').classList.add('hidden');
    }

    // ดึงข้อมูลสินค้า (ตั้งค่าเริ่มต้นเป็น เก่า -> ใหม่: ascending: true)
    async function loadCategoryProducts(catId) {
      const isAsc = document.getElementById('sort-order').value === 'asc';

      const { data: products, error } = await supabaseClient
        .from('products')
        .select(`
          *,
          product_images ( id, image_url, sort_order )
        `)
        .eq('category_id', catId)
        .eq('is_active', true)
        .order('id', { ascending: isAsc }); // 🔥 เรียง เก่า -> ใหม่ (เพิ่มใหม่ตามหลัง)

      if (error) return console.error("เกิดข้อผิดพลาดในการดึงสินค้า:", error.message);

      currentCategoryProducts = (products || []).map(p => {
        let prodImgs = (p.product_images || []).sort((a, b) => a.sort_order - b.sort_order);
        if (prodImgs.length === 0 && p.image_url) {
          prodImgs.push({ id: 'legacy', image_url: p.image_url, sort_order: 0 });
        }
        return { ...p, images: prodImgs };
      });

      renderProducts(currentCategoryProducts);
    }

    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      if (items.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-12">ไม่พบสินค้าในหมวดหมู่นี้</p>`;
        return;
      }

      grid.innerHTML = items.map(p => {
        // 🔥 ดึงรูปปก cover_url มาแสดงก่อน ถ้าไม่มีใช้ image_url -> รูป A4 ใบแรก
        const coverImg = p.cover_url || p.image_url || p.images[0]?.image_url || 'https://via.placeholder.com/400x500?text=No+Image';
        const imgCount = p.images.length;

        return `
          <div class="bg-white border border-slate-200 rounded-3xl p-3 shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between">
            <div>
              <div onclick="openA4ModalByProdId(${p.id})" class="aspect-[1/1.414] rounded-2xl overflow-hidden bg-slate-50 mb-3 border border-slate-200 relative cursor-pointer hover:opacity-95 transition flex items-center justify-center p-1 group">
                <img src="${coverImg}" class="w-full h-full object-contain">
                <div class="absolute inset-0 bg-slate-900/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-medium gap-1 rounded-2xl">
                  <i data-lucide="maximize-2" class="w-4 h-4"></i> ขยายรูป
                </div>
                ${imgCount > 1 ? `<span class="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">${imgCount} หน้า</span>` : ''}
              </div>
              <h4 class="font-bold text-sm text-slate-800 truncate px-1 mb-3">${p.title}</h4>
            </div>

            <button onclick="openA4ModalByProdId(${p.id})" class="w-full text-center text-xs font-semibold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 py-2.5 rounded-2xl transition">
              คลิกดูภาพเต็ม A4 ${imgCount > 1 ? `(${imgCount} หน้า)` : ''}
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function handleSortChange() {
      if (currentCategoryId) {
        loadCategoryProducts(currentCategoryId);
      }
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = currentCategoryProducts.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function openA4ModalByProdId(prodId) {
      const prod = currentCategoryProducts.find(p => p.id === prodId);
      if (!prod) return;
      activeModalImages = prod.images.map(i => i.image_url);
      modalImageIndex = 0;
      document.getElementById('modal-title').innerText = prod.title;
      updateModalImageDisplay();
      document.getElementById('a4-modal').classList.remove('hidden');
    }

    function updateModalImageDisplay() {
      document.getElementById('modal-img-a4').src = activeModalImages[modalImageIndex];
      document.getElementById('modal-counter').innerText = `${modalImageIndex + 1} / ${activeModalImages.length}`;
      const nav = document.getElementById('modal-nav');
      if (activeModalImages.length > 1) nav.classList.remove('hidden');
      else nav.classList.add('hidden');
    }

    function nextModalImg() {
      if (modalImageIndex < activeModalImages.length - 1) {
        modalImageIndex++;
        updateModalImageDisplay();
      }
    }

    function prevModalImg() {
      if (modalImageIndex > 0) {
        modalImageIndex--;
        updateModalImageDisplay();
      }
    }

    function closeA4Modal() { document.getElementById('a4-modal').classList.add('hidden'); }

    init();
  </script>
</body>
</html>
